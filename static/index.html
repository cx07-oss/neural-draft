<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080D14"><meta name="description" content="Neural-Draft is a competitive game where real-world decisions become the cards you play.">
  <title>Neural-Draft — Forge your next move</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%2342C6E8' d='M20 2 38 20 20 38 2 20zm0 9-9 9 9 9 9-9z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script>
</head>
<body>
  <a href="#main" class="skip">Skip to content</a>
  <header class="topbar"><a href="#home" class="brand" aria-label="Neural-Draft home"><span class="brand-mark">⌘</span> NEURAL<span class="muted">—</span>DRAFT</a><button class="focus-open" id="focus-open" type="button" data-action="access-open" aria-expanded="false" aria-controls="access-panel">Focus</button><nav aria-label="Main"><button class="nav-btn" data-go="forge">Forge</button><button class="nav-btn" data-go="collection">Collection <span id="collection-count">0</span></button><button class="nav-btn" data-action="battle-nav">Battle</button><button class="nav-btn" data-action="profile-nav">Profile</button><span id="identity" class="identity">Guest</span></nav></header>
  <section id="access-panel" class="access-panel" hidden aria-labelledby="access-title">
    <div class="access-head"><h2 id="access-title">Focus mode</h2><button type="button" class="text-btn" data-action="access-open">Close</button></div>
    <p>Same game. Less clutter, and no countdown.</p>
    <div class="access-list">
      <button type="button" data-action="access-set" data-id="focus" aria-pressed="false">Focus mode <span class="access-state">Off</span></button>
      <button type="button" data-action="access-set" data-id="motion" aria-pressed="false">Reduced motion <span class="access-state">Off</span></button>
      <button type="button" data-action="access-set" data-id="pace" aria-pressed="false">Flexible pacing <span class="access-state">Off</span></button>
      <button type="button" data-action="access-set" data-id="large" aria-pressed="false">Large text <span class="access-state">Off</span></button>
      <button type="button" data-action="access-set" data-id="contrast" aria-pressed="false">High contrast <span class="access-state">Off</span></button>
      <button type="button" data-action="access-set" data-id="sound" aria-pressed="false">Sound <span class="access-state">Off</span></button>
      <button type="button" data-action="access-set" data-id="music" aria-pressed="false">Music <span class="access-state">Off</span></button>
    </div>
  </section>
  <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
  <footer><span><i class="status-dot"></i> Neural-Draft</span><span>Forge · Battle · Adapt</span></footer>
  <div id="toast" role="alert" class="toast" hidden></div>
</body>
</html>
